name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  repository:
    uses: ./.github/workflows/repository.yml
  prepare:
    name: prepare-toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CXX: g++-14
    outputs:
      artifact: toolchain-${{ github.run_id }}-${{ github.run_attempt }}
      artifact-id: ${{ steps.handoff.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ensure native build prerequisites
        uses: ./.github/actions/native-prerequisites
      - name: Compute installation compatibility
        id: identity
        run: python3 tools/toolchain_cache.py key --github-output "$GITHUB_OUTPUT"
      - name: Restore exact compatible installation
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.identity.outputs.key }}
          path: |
            .tools/
            .deps/downloads/
            .deps/src/uvm/
            .deps/liberty.lib
      - name: Validate restored installation or build once on a cold miss
        run: python3 tools/toolchain_cache.py prepare --jobs 2 --restored-key "${{ steps.cache.outputs.cache-matched-key }}"
      - name: Read validated preparation outcome
        id: prepared
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import subprocess
          from pathlib import Path
          report = json.loads(Path('.build/setup-cache/preparation.json').read_text())
          assert report['result'] == 'PASS' and report['source'] in ('cold', 'cache')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('source=' + report['source'] + '\n')
              stream.write('cache-status=' + report['cache_status'] + '\n')
              revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              stream.write('revision=' + revision + '\n')
          PYCODE
      - name: Record ${{ steps.prepared.outputs.source }} (${{ steps.prepared.outputs.cache-status }}) preparation at ${{ steps.prepared.outputs.revision }}
        run: cat .build/setup-cache/preparation.json
      - name: Save only a complete validated installation
        continue-on-error: true
        if: ${{ success() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.identity.outputs.key }}
          path: |
            .tools/
            .deps/downloads/
            .deps/src/uvm/
            .deps/liberty.lib
      - name: Package installation for this run's consumers
        run: |
          mkdir -p .build/toolchain-transfer
          tar --zstd -cf .build/toolchain-transfer/toolchain.tar.zst .tools .deps/downloads .deps/src/uvm .deps/liberty.lib
      - name: Record handoff retention fallback
        run: |
          echo "::notice::The ephemeral toolchain handoff expires after one day if cancellation or restricted permissions prevent cleanup. Diagnostic/result artifacts keep their own retention."
          printf '%s\n' 'Toolchain handoff: one-day retention fallback if post-consumer cleanup cannot complete; diagnostic/result artifacts are preserved.' >> "$GITHUB_STEP_SUMMARY"
      - name: Transfer prepared installation
        id: handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/toolchain-transfer/toolchain.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Retain preparation provenance and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/setup-cache/
            .build/setup/
            .build/runs/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
  capability:
    needs: prepare
    name: capability-${{ matrix.gate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gate: [uvm, formal, synth, frontends, bridge, representation-formal, fifo-mapping]
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ensure native build prerequisites
        uses: ./.github/actions/native-prerequisites
      - name: Receive prepared installation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: .build/toolchain-transfer
      - name: Unpack and validate; consumers never build
        run: |
          tar --zstd -xpf .build/toolchain-transfer/toolchain.tar.zst
          python3 tools/toolchain_cache.py validate
      - name: Qualify installed versions and selected capability
        run: make ci JOBS=2 RUN_ARGS='--test doctor --test repo --test unit --test lint --test ${{ matrix.gate }}'
      - name: Retain manifests, separate logs, coverage, traces and mapped netlists
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-${{ matrix.gate }}-${{ github.sha }}
          path: |
            .build/runs/
            .build/setup-cache/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
  contracts:
    needs: prepare
    uses: ./.github/workflows/contracts.yml
    with:
      toolchain-artifact: ${{ needs.prepare.outputs.artifact }}
  storage:
    needs: prepare
    uses: ./.github/workflows/storage.yml
    with:
      toolchain-artifact: ${{ needs.prepare.outputs.artifact }}
  csr:
    needs: prepare
    uses: ./.github/workflows/csr.yml
    with:
      toolchain-artifact: ${{ needs.prepare.outputs.artifact }}
  foundation:
    needs: prepare
    uses: ./.github/workflows/uvm-foundation.yml
    with:
      toolchain-artifact: ${{ needs.prepare.outputs.artifact }}
  cleanup-handoff:
    name: cleanup-handoff
    if: ${{ always() }}
    needs: [prepare, capability, contracts, storage, csr, foundation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete only this run's handoff; warn on one-day fallback
        id: cleanup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/cleanup_toolchain_artifact.py \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --artifact-id "${{ needs.prepare.outputs.artifact-id }}"
      - name: Handoff ${{ steps.cleanup.outputs.status }}
        run: echo "Diagnostic and result artifacts are preserved."
