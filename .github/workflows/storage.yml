name: Storage and queue components
on:
  workflow_call:
    inputs:
      toolchain-artifact:
        required: true
        type: string
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ensure native build prerequisites
        uses: ./.github/actions/native-prerequisites
      - name: Receive the prepared installation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.toolchain-artifact }}
          path: .build/toolchain-transfer
      - name: Unpack and validate; consumers never build
        run: |
          tar --zstd -xpf .build/toolchain-transfer/toolchain.tar.zst
          python3 tools/toolchain_cache.py validate
      - name: Check storage and queue components at every production size
        shell: bash
        run: |
          set -euo pipefail
          for profile in F0 F1 I0 I1 E0 E1; do
            make regression RUN_ARGS="--profile $profile --test pools --test queues --test queues-independent --test queues-dispatch-guard --seed 17"
          done
      - name: Validate saved independent queue coverage by elaboration
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          import subprocess
          for profile in ('F0','F1','I0','I1','E0','E1'):
              inputs=[]
              for path in Path('.build/runs').glob('regression-*/queues-independent-*/manifest.json'):
                  case=json.loads(path.read_text())
                  if case['profile']==profile and case['test'] in ('queues-independent-native','queues-independent-wide'):
                      inputs += ['--coverage-manifest',str(path)]
              if len(inputs)!=4:
                  raise SystemExit('Missing or duplicate independent coverage for '+profile)
              subprocess.run(['python3','tools/run.py','coverage','--profile',profile,
                              '--test','queues-independent',*inputs],check=True)
          PYCODE
      - name: Prove production storage/queues and qualify seeded defect detection
        run: make formal-rtl RUN_ARGS='--timeout 240'
      - name: Preserve independent formal fixture route
        run: make formal-smoke
      - name: Retain storage evidence and counterexamples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storage-${{ github.sha }}
          path: |
            .build/runs/
            .build/setup-cache/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
