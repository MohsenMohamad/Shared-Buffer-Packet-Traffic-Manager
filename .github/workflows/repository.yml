name: Repository
on:
  workflow_call:
permissions:
  contents: read
jobs:
  repository-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/check_repository.py
  python-unit-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python units and Python JSON shell syntax (no HDL toolchain)
        run: python3 tools/check_light.py
      - name: Capture isolation and external-output regression
        run: PYTHONPATH=tools python3 -m unittest discover -s tests/runner -v
